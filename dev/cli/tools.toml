[defaults]
cooldown_days = 7

[[tool]]
name = "litestream"
method = "release"
repo = "benbjohnson/litestream"
version = "0.5.17"
asset = "litestream-{version}-linux-x86_64.tar.gz"
checksum = "checksums.txt"
bin = "litestream"
priority = "P1"
group = "post-dock"
category = "database"
probe = ["litestream", "version"]

[[tool]]
name = "aws"
method = "vendor"
url = "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip"
sig_url = "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip.sig"
# AWS CLI 설치 문서(getting-started-install)에 게시된 지문, 261102 확인.
gpg_fingerprint = "FB5DB77FD5C118B80511ADA8A6310ACC4672475C"
# 키서버의 aws 키는 만료(EXPKEYSIG)라 문서에 게시된 키를 저장소에 둔다. 만료 2027-06, 지문은 위와 같다.
key_file = "keys/aws-cli.asc"
version_from = "github:aws/aws-cli"
bin = "aws/dist/aws"
exe = "aws"
priority = "P1"
group = "post-dock"
category = "cloud"
env = ["AWS_ACCESS_KEY_ID", "AWS_SECRET_ACCESS_KEY", "AWS_DEFAULT_REGION"]
probe = ["aws", "--version"]
status = "pending"

[[tool]]
name = "creem"
method = "bun"
package = "@creem_io/cli"
version = "0.9.0"
bin = "creem"
priority = "P2"
group = "post-dock"
category = "payment"
env = ["CREEM_API_KEY"]
probe = ["creem", "--version"]

[[tool]]
name = "ovhcloud"
method = "release"
repo = "ovh/ovhcloud-cli"
version = "0.16.0"
asset = "ovhcloud-cli_Linux_x86_64.tar.gz"
checksum = "ovhcloud-cli_{version}_checksums.txt"
bin = "ovhcloud"
priority = "P2"
group = "post-dock"
category = "cloud"
env = ["OVH_ENDPOINT", "OVH_APPLICATION_KEY", "OVH_APPLICATION_SECRET", "OVH_CONSUMER_KEY"]
probe = ["ovhcloud", "version"]

[[tool]]
name = "xurl"
method = "release"
repo = "xdevplatform/xurl"
version = "1.3.4"
asset = "xurl_Linux_x86_64.tar.gz"
checksum = "xurl_{version}_checksums.txt"
bin = "xurl"
priority = "P3"
group = "post-dock"
category = "social"
probe = ["xurl", "--version"]

[[tool]]
name = "goat"
method = "release"
repo = "bluesky-social/goat"
version = "0.2.8"
asset = "goat_Linux_x86_64.tar.gz"
checksum = "goat_{version}_checksums.txt"
sig = "goat_{version}_checksums.txt.sig"
# 서명의 issuer-fpr 에서 추출(261102). keyserver.ubuntu.com 에서 받은 키로 GOODSIG 확인(서명자 bnewbold = 릴리스 작성자). 설치 시 키 출처를 사용자가 한 번 승인해야 한다.
gpg_fingerprint = "0C8E4A0DA8E9990872952B3B084425E080357D53"
bin = "goat"
priority = "P3"
group = "post-dock"
category = "social"
env = ["GOAT_USERNAME", "GOAT_PASSWORD"]
probe = ["goat", "--version"]

[[tool]]
name = "gcloud"
method = "vendor"
url = "https://dl.google.com/dl/cloudsdk/channels/rapid/downloads/google-cloud-cli-linux-x86_64.tar.gz"
bin = "google-cloud-sdk/bin/gcloud"
exe = "gcloud"
priority = "P3"
group = "post-dock"
category = "cloud"
probe = ["gcloud", "--version"]
status = "pending"

[[tool]]
name = "oauth2l"
method = "vendor"
url = "https://storage.googleapis.com/oauth2l/latest/linux_amd64.tgz"
bin = "oauth2l"
priority = "P3"
group = "post-dock"
category = "cloud"
probe = ["oauth2l", "--help"]
status = "pending"

[[tool]]
name = "ant"
method = "release"
repo = "anthropics/anthropic-cli"
version = "2.4.0"
asset = "ant_{version}_linux_amd64.tar.gz"
checksum = "ant_{version}_checksums.txt"
bin = "ant"
priority = "P3"
group = "post-dock"
category = "ai"
env = ["ANTHROPIC_API_KEY"]
probe = ["ant", "--version"]

[[tool]]
name = "cf"
method = "bun"
package = "cf"
version = "0.15.0"
bin = "cf"
priority = "P2"
group = "post-dock"
category = "cloud"
env = ["CLOUDFLARE_API_TOKEN"]
probe = ["cf", "--version"]

[[tool]]
name = "osv-scanner"
method = "release"
repo = "google/osv-scanner"
version = "2.7.0"
asset = "osv-scanner_linux_amd64"
checksum = "osv-scanner_SHA256SUMS"
bin = "osv-scanner"
priority = "P2"
group = "post-dock"
category = "security"
probe = ["osv-scanner", "--version"]

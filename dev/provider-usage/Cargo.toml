[package]
name = "provider-usage"
version = "0.1.0"
edition = "2021"
description = "Provider remaining-usage snapshots and skip policy for grade fallback"

[dependencies]
anyhow = "1"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
